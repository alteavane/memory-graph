[project]
name = "memorygraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kuzu>=0.7.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memorygraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
